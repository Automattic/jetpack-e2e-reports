name: Performance Report

on:
  repository_dispatch:
    types: [block-perf]

  workflow_dispatch:
    inputs:
      runId:
        description: 'Run ID'
        required: true
        default: '986899084'
      repository:
        description: 'Repository'
        required: true
        default: 'automattic/jetpack'

permissions:
  contents: read
  actions: read

jobs:
  report:
    name: "Create new test report"
    runs-on: ubuntu-latest

    steps:
      - name: Setup Node
        uses: actions/setup-node@v4

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set environment variables
        env:
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          echo "GITHUB_EVENT_NAME: $GITHUB_EVENT_NAME"

          if [ "$GITHUB_EVENT_NAME" == workflow_dispatch ]; then
            # For manual dispatch, use inputs directly (these are trusted)
            echo "RUN_ID=${{ github.event.inputs.runId }}" >> $GITHUB_ENV
            echo "REPOSITORY=${{ github.event.inputs.repository }}" >> $GITHUB_ENV
          else
            # For repository_dispatch, use jq to safely parse
            echo "Received event '${{ github.event.action }}'"
            echo "RUN_ID=$(echo "$PAYLOAD" | jq -r '.run_id // ""')" >> $GITHUB_ENV
            echo "REPOSITORY=$(echo "$PAYLOAD" | jq -r '.repository // ""')" >> $GITHUB_ENV
            echo 'CLIENT_PAYLOAD<<EOF' >> $GITHUB_ENV
            echo "$PAYLOAD" >> $GITHUB_ENV
            echo 'EOF' >> $GITHUB_ENV
          fi

      - name: Validate inputs
        run: ./bin/validate-inputs.sh

      - name: Validate repository source
        if: github.event_name == 'repository_dispatch'
        run: |
          # Only allow repository_dispatch from Automattic organization
          if [[ ! "$REPOSITORY" =~ ^Automattic/.+ ]]; then
            echo "::error::Repository '$REPOSITORY' is not in Automattic organization"
            exit 1
          fi

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

      - name: Wait for artifacts to be available
        run: ./bin/wait-for-artifacts.sh

      - name: Download artifacts
        uses: dawidd6/action-download-artifact@23e7b2e9aa32a408a649c4fca36dee127ff5d325 # v11
        with:
          repo: ${{ env.REPOSITORY }}
          workflow: block-performance.yml
          workflow_conclusion: "completed"
          run_id: ${{ env.RUN_ID }}
          path: ../downloads

      - name: Install dependencies
        run: npm install

      - name: Generate performance report
        env:
          RESULTS_PATH: ../downloads
        run: node ./bin/generate-perf-report.js
